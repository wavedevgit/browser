name: librewolf-custom-build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y wget tar python3 python3-pip rustc cargo clang llvm make nodejs git patch

      - name: Download source
        run: |
          URL="https://codeberg.org/api/packages/librewolf/generic/librewolf-source/149.0.2-2/librewolf-149.0.2-2.source.tar.gz"
          wget -qO source.tar.gz "$URL"

      - name: Extract source
        run: |
          tar xf source.tar.gz
          echo "Extracted structure:"
          find . -maxdepth 2 -type d

      - name: Detect source root
        run: |
          ROOT=$(find . -type f -path "*/dom/base/Navigator.cpp" | head -n 1 | sed 's|/dom/base/Navigator.cpp||')
          echo "ROOT=$ROOT"
          echo "ROOT=$ROOT" >> $GITHUB_ENV

      - name: Apply patch
        run: |
          cd "$ROOT"
          patch -p1 < ../webdriver-disable.patch

      - name: Build
        run: |
          cd "$ROOT"
          ./mach build

      - name: Package
        run: |
          cd "$ROOT"
          ./mach package

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ env.ROOT }}/dist/

  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            base-devel
            git
            wget
            tar
            python
            python-pip
            mingw-w64-x86_64-toolchain
            rust
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-nodejs
            patch

      - name: Download source
        run: |
          URL="https://codeberg.org/api/packages/librewolf/generic/librewolf-source/149.0.2-2/librewolf-149.0.2-2.source.tar.gz"
          wget -qO source.tar.gz "$URL"

      - name: Extract source
        run: |
          tar xf source.tar.gz
          find . -maxdepth 2 -type d

      - name: Detect source root
        run: |
          ROOT=$(find . -type f -path "*/dom/base/Navigator.cpp" | head -n 1 | sed 's|/dom/base/Navigator.cpp||')
          echo "ROOT=$ROOT"
          echo "ROOT=$ROOT" >> $GITHUB_ENV

      - name: Apply patch
        run: |
          cd "$ROOT"
          patch -p1 < ../webdriver-disable.patch

      - name: Build
        run: |
          cd "$ROOT"
          ./mach build

      - name: Package
        run: |
          cd "$ROOT"
          ./mach package

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.ROOT }}/dist/

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/**
            windows/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
