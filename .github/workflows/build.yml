name: librewolf-custom-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: false
        default: "dev-build"

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y \
            wget tar python3 python3-pip \
            rustc cargo clang llvm make \
            nodejs git patch

      - name: Download source
        run: |
          wget -qO source.tar.gz \
          https://codeberg.org/api/packages/librewolf/generic/librewolf-source/149.0.2-2/librewolf-149.0.2-2.source.tar.gz

      - name: Extract
        run: tar xf source.tar.gz

      - name: Detect root
        run: |
          ROOT=$(find . -type f -path "*/dom/base/Navigator.cpp" | head -n 1 | sed 's|/dom/base/Navigator.cpp||')
          echo "ROOT=$ROOT" >> $GITHUB_ENV

      - name: Apply patch
        run: |
          cd "$ROOT"
          patch -p1 < ../webdriver-disable.patch

      - name: Configure (artifact build)
        run: |
          cd "$ROOT"

          echo 'ac_add_options --enable-artifact-builds' >> .mozconfig
          echo 'ac_add_options --disable-debug' >> .mozconfig
          echo 'ac_add_options --disable-tests' >> .mozconfig

          # reduce memory usage
          echo 'mk_add_options MOZ_PARALLEL_BUILD=2' >> .mozconfig

      - name: Build
        run: |
          cd "$ROOT"
          ./mach build

      - name: Package
        run: |
          cd "$ROOT"
          ./mach package

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ env.ROOT }}/dist/


  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ✅ correct python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ✅ install MozillaBuild (fixed, no fake curl)
      - name: Install MozillaBuild
        run: |
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe"
          $out = "mozillabuild.exe"

          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process -Wait -FilePath $out -ArgumentList "/S"
        shell: powershell

      - name: Setup environment
        run: |
          echo "MOZILLABUILD=C:\mozilla-build" >> $env:GITHUB_ENV
          echo "PATH=C:\mozilla-build\bin;$env:PATH" >> $env:GITHUB_ENV
        shell: powershell

      - name: Download source
        run: |
          curl.exe -L -o source.tar.gz \
          https://codeberg.org/api/packages/librewolf/generic/librewolf-source/149.0.2-2/librewolf-149.0.2-2.source.tar.gz
        shell: bash

      - name: Extract
        run: tar xf source.tar.gz
        shell: bash

      - name: Detect root
        run: |
          ROOT=$(find . -type f -path "*/dom/base/Navigator.cpp" | head -n 1 | sed 's|/dom/base/Navigator.cpp||')
          echo "ROOT=$ROOT" >> $GITHUB_ENV
        shell: bash

      - name: Apply patch
        run: |
          cd "$ROOT"
          patch -p1 < ../webdriver-disable.patch
        shell: bash

      - name: Configure (artifact build)
        run: |
          cd "$ROOT"

          echo 'ac_add_options --enable-artifact-builds' >> .mozconfig
          echo 'ac_add_options --disable-debug' >> .mozconfig
          echo 'ac_add_options --disable-tests' >> .mozconfig

          echo 'mk_add_options MOZ_PARALLEL_BUILD=2' >> .mozconfig
        shell: bash

      - name: Build
        run: |
          cd "$ROOT"
          ./mach build
        shell: bash

      - name: Package
        run: |
          cd "$ROOT"
          ./mach package
        shell: bash

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.ROOT }}/dist/


  release:
    needs: [linux, windows]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-build
          path: windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: |
            linux/**
            windows/**
